name: EduPredict AI - 24/7 Server

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/index.html'

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install packages
        run: |
          pip install -q streamlit pandas numpy scikit-learn xgboost lightgbm \
            matplotlib seaborn imbalanced-learn joblib ucimlrepo shap plotly scipy
          export MPLBACKEND=Agg
          echo "MPLBACKEND=Agg" >> $GITHUB_ENV

      - name: Download cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start Streamlit
        run: |
          MPLBACKEND=Agg nohup streamlit run app.py \
            --server.port 8502 \
            --server.headless true \
            --server.enableCORS false \
            --server.enableXsrfProtection false > /tmp/sl.log 2>&1 &
          sleep 20

      - name: Start tunnel
        run: |
          nohup ./cloudflared tunnel --protocol http2 --url http://localhost:8502 > /tmp/cf.log 2>&1 &
          sleep 25
          URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' /tmp/cf.log | head -1)
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
          echo "URL: $URL"

      - name: Update GitHub Pages with new URL
        env:
          TUNNEL_URL: ${{ env.TUNNEL_URL }}
        run: |
          sed "s|TUNNEL_URL_PLACEHOLDER|$TUNNEL_URL|g" docs/template.html > docs/index.html
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin main
          git reset --hard origin/main
          sed "s|TUNNEL_URL_PLACEHOLDER|$TUNNEL_URL|g" docs/template.html > docs/index.html
          git add docs/index.html
          git commit -m "Live: $TUNNEL_URL [skip ci]" || echo "no change"
          git push origin main

      - name: Keep server alive
        run: |
          echo "Running: ${{ env.TUNNEL_URL }}"
          sleep 19500
